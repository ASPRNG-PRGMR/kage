[package]
name = "kage"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kage"
path = "src/main.rs"

[lib]
name = "kage"
path = "src/lib.rs"

[dependencies]
# Font loading and rasterization.
# package = "freetype-rs" selects the PistonDevelopers safe wrapper whose lib
# name is "freetype" (not the raw FFI crate also named "freetype" on crates.io).
# The "bundled" feature compiles FreeType from vendored C source — no system
# libfreetype2-dev / pkg-config required.
freetype = { package = "freetype-rs", version = "0.38", features = ["bundled"] }

# Lightweight software framebuffer window (no GPU required for Phase 1).
minifb = "0.28"

# CLI argument parsing.
clap = { version = "4", features = ["derive"] }

# Panel description files (layouts/*.toml).
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# OpenGL backend: GL bindings and an off-screen EGL context. libEGL is loaded
# at run time, so there is no link-time dependency on it.
glow = { version = "0.14", optional = true }
khronos-egl = { version = "6", features = ["dynamic"], optional = true }

# Vulkan backend: Vulkan bindings (libvulkan is loaded at run time) and a
# GLSL → SPIR-V compiler for the compute shader.
ash = { version = "0.38", optional = true }
naga = { version = "22", features = ["glsl-in", "spv-out"], optional = true }

[features]
default = ["opengl", "vulkan"]
opengl = ["dep:glow", "dep:khronos-egl"]
vulkan = ["dep:ash", "dep:naga"]

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 1
