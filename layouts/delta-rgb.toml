# Delta RGB (QD-OLED): green above, red and blue side by side below
#
# Nominal geometry: this file reproduces KAGE's built-in preset. It records
# the layout's topology (which emitters exist and how they are arranged) with
# plausible aperture sizes. It is NOT a measurement of any particular panel.
# Copy it and replace the numbers with measured ones; see layouts/README.md.

name   = "Delta RGB (nominal)"
source = "KAGE built-in nominal preset"
layout = "delta"
cell   = [1, 1]

# Blur width per colour relative to green (nominal).
[bleed]
red   = 1.20
green = 1.00
blue  = 1.10

[[emitter]]
channel = "green"
center  = [0.5, 0.27]
size    = [0.44, 0.34]

[[emitter]]
channel = "red"
center  = [0.26, 0.73]
size    = [0.36, 0.36]

[[emitter]]
channel = "blue"
center  = [0.75, 0.73]
size    = [0.32, 0.36]
