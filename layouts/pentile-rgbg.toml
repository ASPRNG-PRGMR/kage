# Pentile RGBG: green in every pixel, red and blue alternating in a checkerboard
#
# Nominal geometry: this file reproduces KAGE's built-in preset. It records
# the layout's topology (which emitters exist and how they are arranged) with
# plausible aperture sizes. It is NOT a measurement of any particular panel.
# Copy it and replace the numbers with measured ones; see layouts/README.md.

name   = "Pentile RGBG (nominal)"
source = "KAGE built-in nominal preset"
layout = "pentile"
cell   = [2, 2]

# Blur width per colour relative to green (nominal).
[bleed]
red   = 1.20
green = 1.00
blue  = 1.10

[[emitter]]
channel = "red"
center  = [0.28, 0.5]
size    = [0.3, 0.5]

[[emitter]]
channel = "green"
center  = [0.76, 0.5]
size    = [0.18, 0.46]

[[emitter]]
channel = "blue"
center  = [1.28, 0.5]
size    = [0.36, 0.62]

[[emitter]]
channel = "green"
center  = [1.76, 0.5]
size    = [0.18, 0.46]

[[emitter]]
channel = "blue"
center  = [0.28, 1.5]
size    = [0.36, 0.62]

[[emitter]]
channel = "green"
center  = [0.76, 1.5]
size    = [0.18, 0.46]

[[emitter]]
channel = "red"
center  = [1.28, 1.5]
size    = [0.3, 0.5]

[[emitter]]
channel = "green"
center  = [1.76, 1.5]
size    = [0.18, 0.46]
